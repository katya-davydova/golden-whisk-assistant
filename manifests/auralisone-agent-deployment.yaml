apiVersion: apps/v1
kind: Deployment
metadata:
  name: auralisone-agent-deployment
  labels:
    app: auralisone-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auralisone-agent
  template:
    metadata:
      labels:
        app: auralisone-agent
    spec:
      containers:
        - name: auralisone-agent
          image: rag-streamlit:1.0
          imagePullPolicy: IfNotPresent                   # {replace with your image name}
          ports:
            - containerPort: 8501
          envFrom:
            #- configMapRef:
                #name: auralisone-config
            - secretRef:
                name: auralisone-agent-secrets

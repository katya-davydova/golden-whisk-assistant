apiVersion: v1
kind: Service
metadata:
  name: auralisone-agent-service
  labels:
    app: auralisone-agent
spec:
  type: ClusterIP  # Use ClusterIP for internal access only
  #type: LoadBalancer # Use LoadBalancer for external access
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
  selector:
    app: auralisone-agent


# kubectl port-forward svc/auralisone-agent-service 80:80